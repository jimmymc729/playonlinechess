<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --board-frame-bg: #123154;
    --board-frame-border: #0a2a5a;
    --board-frame-glow: rgba(0, 100, 200, 0.28);
    --board-light: #e7d6b1;
    --board-dark: #956839;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, system-ui, sans-serif;
    background: #0a1a2e;
    color: #fff;
    touch-action: manipulation;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  .hidden { display: none !important; }

  #topbar {
    padding:
      calc(6px + var(--safe-top))
      calc(10px + var(--safe-right))
      6px
      calc(10px + var(--safe-left));
    background: #061225;
    border-bottom: 2px solid #1a3a5c;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
  }

  #topbar-row1 {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    justify-content: flex-start;
    width: 100%;
    flex-wrap: nowrap;
  }

  #score {
    font-size: clamp(18px, 5.6vw, 30px);
    font-weight: 900;
    letter-spacing: 1.2px;
    line-height: 1;
    white-space: nowrap;
  }
  #score .wht { color: #f8f4e3; }
  #score .blk { color: #b7c8da; }
  #score .dash { color: #5a7a9a; margin: 0 8px; }

  #menu-btn,
  #reset-btn,
  #difficulty-btn,
  #board-theme-btn,
  #sound-btn,
  #share-btn {
    height: 40px;
    min-height: 40px;
    border-radius: 10px;
    border: 2px solid;
    cursor: pointer;
    font-weight: 800;
    padding: 0 10px;
    line-height: 1;
    white-space: nowrap;
  }

  #difficulty-btn,
  #board-theme-btn {
    font-size: clamp(13px, 3.5vw, 16px);
    background: #1a3a5c;
    color: #fff;
    border-color: #2a5a8c;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    padding-right: 28px;
    background-image:
      linear-gradient(45deg, transparent 50%, #9ec3ff 50%),
      linear-gradient(135deg, #9ec3ff 50%, transparent 50%);
    background-position:
      calc(100% - 16px) calc(50% - 2px),
      calc(100% - 11px) calc(50% - 2px);
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    min-width: 88px;
  }

  #difficulty-btn { margin-left: auto; }
  #board-theme-btn { min-width: 108px; }

  #sound-btn {
    width: 40px;
    min-width: 40px;
    font-size: 18px;
    padding: 0;
    background: #1a3a5c;
    color: #fff;
    border-color: #2a5a8c;
    flex: 0 0 auto;
  }

  #share-btn {
    font-size: clamp(12px, 3.4vw, 15px);
    color: #9bf9d6;
    background: #123225;
    border-color: #286e4e;
    display: none;
  }

  #menu-btn {
    font-size: clamp(12px, 3.4vw, 15px);
    color: #9ec3ff;
    background: #13223a;
    border-color: #2a4a74;
    flex: 0 0 auto;
  }

  #reset-btn {
    font-size: clamp(12px, 3.4vw, 15px);
    color: #ffb0a8;
    background: #2a1a1a;
    border-color: #5a2a2a;
    flex: 0 0 auto;
  }

  #menu-btn { grid-area: menu; }
  #reset-btn { grid-area: reset; }
  #score { grid-area: score; }
  #difficulty-btn { grid-area: difficulty; }
  #board-theme-btn { grid-area: boardtheme; }
  #sound-btn { grid-area: sound; }
  #share-btn { grid-area: share; }

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    min-height: 0;
  }

  #game-insights {
    position: fixed;
    z-index: 8;
    width: clamp(136px, 16vw, 190px);
    max-height: min(62vh, 520px);
    border: 2px solid #35557f;
    border-radius: 12px;
    background: rgba(8, 23, 42, 0.92);
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: auto;
  }

  #opening-name {
    flex: 0 0 auto;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid #35557f;
    background: rgba(16, 39, 71, 0.88);
    color: #d6e8ff;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #moves-tape {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    padding-right: 2px;
  }

  .move-chip {
    display: grid;
    grid-template-columns: auto 1fr 1fr;
    gap: 6px;
    align-items: center;
    padding: 5px 7px;
    border-radius: 8px;
    border: 1px solid #2f4f75;
    background: rgba(12, 33, 58, 0.84);
    color: #cfe2fb;
    font-size: 12px;
    font-weight: 700;
  }

  .move-chip .n {
    color: #8fb2da;
    font-weight: 900;
  }

  .move-chip .w { color: #f5e9c8; }
  .move-chip .b { color: #bcd3ee; text-align: right; }

  .move-chip.latest {
    border-color: #6fc6b6;
    box-shadow: 0 0 0 1px rgba(111, 198, 182, 0.32) inset;
  }

  .moves-empty {
    color: #8da9c9;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 4px;
    text-align: center;
  }

  .panel {
    width: 100%;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    position: relative;
    min-height: 56px;
    transition: opacity 0.25s, filter 0.25s;
  }

  .panel.dim { opacity: 0.28; filter: grayscale(60%); }
  .panel.cpu-focus.dim { opacity: 1; filter: none; }

  .panel-label {
    font-size: clamp(12px, 3.3vw, 16px);
    font-weight: 900;
    letter-spacing: 1px;
    text-align: center;
    display: none;
  }

  .panel-left .panel-label { color: #86b4e0; }
  .panel-right .panel-label { color: #f4e7c3; }

  .turn-indicator {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 3px solid;
    box-shadow: inset -4px -4px 8px rgba(0,0,0,0.35);
    flex: 0 0 auto;
    display: none;
  }

  .panel-left .turn-indicator {
    background: radial-gradient(circle at 35% 30%, #bfd7ef, #7eaad4 50%, #34567c);
    border-color: #7eaad4;
  }

  .panel-right .turn-indicator {
    background: radial-gradient(circle at 35% 30%, #fff3d0, #ecd5a4 50%, #ac8f4f);
    border-color: #ecd5a4;
  }

  .panel:not(.dim) .turn-indicator { animation: turnpulse 1.6s infinite ease-in-out; }
  @keyframes turnpulse {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.06); filter: brightness(1.24); }
  }

  .panel .your-turn {
    font-size: clamp(11px, 3.1vw, 14px);
    font-weight: 800;
    letter-spacing: 0.7px;
    opacity: 0;
    transition: opacity 0.2s;
    text-align: center;
    min-height: 1em;
  }

  .panel:not(.dim) .your-turn { opacity: 1; }

  .cpu-avatar {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: auto;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    transition: transform 180ms ease, filter 180ms ease;
    z-index: 3;
  }

  .panel.cpu-focus .cpu-avatar {
    left: 12px;
    transform: translateY(-50%) scale(1.06);
  }

  .cpu-avatar.cpu-boardside {
    position: fixed;
    left: 0;
    top: 0;
    transform: translate(-100%, -50%);
    z-index: 25;
    pointer-events: none;
  }

  .cpu-avatar.cpu-boardside .cpu-face {
    pointer-events: auto;
  }

  .cpu-face {
    width: clamp(64px, 14vw, 110px);
    height: clamp(64px, 14vw, 110px);
    border-radius: 4px;
    border: 2px solid #35557f;
    background:
      linear-gradient(90deg, rgba(115, 255, 208, 0.04) 1px, transparent 1px) 0 0 / 8px 8px,
      linear-gradient(rgba(115, 255, 208, 0.04) 1px, transparent 1px) 0 0 / 8px 8px,
      #081224;
    box-shadow: inset 0 0 0 1px rgba(115, 255, 208, 0.12), 0 0 10px rgba(0, 140, 255, 0.14);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    flex: 0 0 auto;
    image-rendering: pixelated;
  }

  .panel.cpu-focus .cpu-face {
    width: clamp(74px, 15vw, 116px);
    height: clamp(74px, 15vw, 116px);
    border-width: 3px;
    box-shadow: inset 0 0 0 1px rgba(115, 255, 208, 0.18), 0 0 16px rgba(0, 170, 255, 0.22);
  }

  .cpu-face.hidden {
    display: none;
  }

  .cpu-chat {
    min-height: 2.3em;
    max-width: min(94%, 190px);
    padding: 5px 8px;
    border: 2px solid rgba(115, 255, 208, 0.32);
    border-radius: 10px;
    background: rgba(10, 28, 52, 0.94);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
    color: #9bf9d6;
    text-align: center;
    font-size: clamp(9px, 1.7vw, 12px);
    font-weight: 800;
    letter-spacing: 0.6px;
    line-height: 1.1;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 140ms ease, border-color 140ms ease, opacity 140ms ease;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
  }

  .panel-left .cpu-chat {
    top: calc(100% + 8px);
    bottom: auto;
  }

  .panel-right .cpu-chat {
    bottom: calc(100% + 8px);
    top: auto;
  }

  .panel.cpu-focus .cpu-chat {
    max-width: min(96vw, 240px);
    font-size: clamp(10px, 2vw, 13px);
    padding: 6px 10px;
  }

  .panel-left .cpu-avatar.cpu-boardside .cpu-chat {
    left: auto;
    right: calc(100% + 10px);
    top: 50%;
    bottom: auto;
    transform: translateY(-50%);
  }

  .panel-left .cpu-avatar.cpu-boardside .cpu-chat::after {
    left: auto;
    right: -6px;
    top: 50%;
    bottom: auto;
    transform: translateY(-50%) rotate(-45deg);
  }

  .panel-right .cpu-avatar.cpu-boardside .cpu-chat {
    left: calc(100% + 10px);
    right: auto;
    top: 50%;
    bottom: auto;
    transform: translateY(-50%);
  }

  .panel-right .cpu-avatar.cpu-boardside .cpu-chat::after {
    left: -6px;
    right: auto;
    top: 50%;
    bottom: auto;
    transform: translateY(-50%) rotate(135deg);
  }

  .cpu-chat::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -8px;
    width: 12px;
    height: 12px;
    background: rgba(18, 40, 58, 0.94);
    border-right: 2px solid rgba(115, 255, 208, 0.32);
    border-bottom: 2px solid rgba(115, 255, 208, 0.32);
    transform: translateX(-50%) rotate(45deg);
  }

  .cpu-chat.hidden {
    display: none;
  }

  .cpu-chat[data-tone="hype"] {
    color: #b7ffea;
    border-color: rgba(151, 255, 228, 0.45);
  }

  .cpu-chat[data-tone="taunt"] {
    color: #ffe08f;
    border-color: rgba(255, 224, 143, 0.4);
  }

  .cpu-chat[data-tone="sad"] {
    color: #9cb6d8;
    border-color: rgba(156, 182, 216, 0.38);
  }

  .cpu-brows {
    display: flex;
    gap: 12px;
    margin-bottom: -3px;
  }

  .cpu-brow {
    width: 12px;
    height: 4px;
    background: #73ffd0;
    box-shadow: 0 0 6px rgba(115, 255, 208, 0.45);
    transform-origin: center center;
    transition: transform 180ms ease, opacity 180ms ease;
  }

  .cpu-eyes {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .cpu-eye {
    width: 11px;
    height: 11px;
    background: #73ffd0;
    box-shadow: 0 0 6px rgba(115, 255, 208, 0.55);
    position: relative;
    overflow: hidden;
    transition: transform 160ms ease, opacity 160ms ease;
  }

  .cpu-eye::after {
    content: '';
    position: absolute;
    width: 4px;
    height: 4px;
    left: 3px;
    top: 3px;
    background: #0b2a22;
    box-shadow: 0 0 4px rgba(0,0,0,0.35);
    animation: cpu-look 2.8s infinite steps(1, end);
  }

  .cpu-mouth {
    width: 28px;
    height: 7px;
    background: #73ffd0;
    box-shadow: 0 0 6px rgba(115, 255, 208, 0.5);
  }

  .cpu-face[data-emotion="idle"] .cpu-eye { animation: cpu-blink 4s infinite; }
  .cpu-face[data-emotion="thinking"] { animation: cpuface-pulse 0.9s infinite ease-in-out; }
  .cpu-face[data-emotion="thinking"] .cpu-mouth { width: 12px; }
  .cpu-face[data-emotion="happy"] .cpu-mouth { clip-path: polygon(0 0, 100% 0, 84% 100%, 16% 100%); }
  .cpu-face[data-emotion="sad"] .cpu-mouth { clip-path: polygon(16% 0, 84% 0, 100% 100%, 0 100%); }
  .cpu-face[data-emotion="smug"] .cpu-brow:first-child { transform: translateY(-1px) rotate(-10deg); }
  .cpu-face[data-emotion="smug"] .cpu-brow:last-child { transform: translateY(1px) rotate(8deg); }
  .cpu-face[data-emotion="smug"] .cpu-mouth { width: 32px; }
  .cpu-face[data-emotion="focused"] .cpu-eye { transform: scale(1.02); }
  .cpu-face[data-emotion="focused"] .cpu-mouth { width: 20px; }
  .cpu-face[data-emotion="annoyed"] .cpu-brow:first-child,
  .cpu-face[data-emotion="annoyed"] .cpu-brow:last-child { transform: translateY(-2px) rotate(0deg); }
  .cpu-face[data-emotion="annoyed"] .cpu-mouth { width: 18px; clip-path: polygon(8% 30%, 92% 30%, 100% 100%, 0 100%); }
  .cpu-face[data-emotion="surprised"] .cpu-mouth { width: 14px; height: 14px; border-radius: 50%; }
  .cpu-face[data-emotion="surprised"] .cpu-eye { transform: scale(1.14); }

  @keyframes cpuface-pulse {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.06); filter: brightness(1.25); }
  }

  @keyframes cpu-blink {
    0%, 46%, 50%, 100% { transform: scaleY(1); }
    48% { transform: scaleY(0.15); }
  }

  @keyframes cpu-look {
    0%, 20% { left: 1px; top: 3px; }
    21%, 45% { left: 5px; top: 3px; }
    46%, 70% { left: 3px; top: 1px; }
    71%, 100% { left: 3px; top: 4px; }
  }

  #board-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2px 8px 8px;
    position: relative;
  }

  #board-wrap.mobile-centered {
    align-items: center;
    padding-top: 14px;
    padding-bottom: 14px;
  }

  #board-container { position: relative; margin: 0 auto; }

  #board {
    background: var(--board-frame-bg);
    border: 5px solid var(--board-frame-border);
    border-radius: 16px;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 0;
    box-shadow: 0 0 28px var(--board-frame-glow);
    position: relative;
    overflow: hidden;
  }

  .cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .cell.light { background: var(--board-light); }
  .cell.dark { background: var(--board-dark); }

  .cell-file-label,
  .cell-rank-label {
    position: absolute;
    pointer-events: none;
    font-size: clamp(10px, 1.5vw, 13px);
    font-weight: 900;
    line-height: 1;
    opacity: 0.86;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.16);
    z-index: 1;
  }

  .cell-file-label {
    right: 6px;
    bottom: 4px;
  }

  .cell-rank-label {
    left: 5px;
    top: 4px;
  }

  .cell.light .cell-file-label,
  .cell.light .cell-rank-label {
    color: rgba(88, 58, 24, 0.72);
  }

  .cell.dark .cell-file-label,
  .cell.dark .cell-rank-label {
    color: rgba(244, 229, 194, 0.82);
  }

  #board[data-theme="AURORA"] .cell.dark {
    background:
      linear-gradient(rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.03)),
      rgba(4, 8, 13, 0.82);
  }

  #board[data-theme="AURORA"]::before {
    content: '';
    position: absolute;
    inset: 8px;
    border-radius: 10px;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 24%, rgba(108, 255, 173, 0.7), rgba(108, 255, 173, 0) 48%),
      radial-gradient(circle at 78% 20%, rgba(102, 156, 255, 0.66), rgba(102, 156, 255, 0) 44%),
      radial-gradient(circle at 76% 76%, rgba(192, 108, 255, 0.64), rgba(192, 108, 255, 0) 46%),
      radial-gradient(circle at 24% 78%, rgba(255, 118, 152, 0.5), rgba(255, 118, 152, 0) 42%),
      linear-gradient(130deg, #08121e 4%, #0d2332 38%, #153249 64%, #112739 100%);
    background-size: 220% 220%;
    animation: aurora-board-drift 34s ease-in-out infinite alternate;
    filter: saturate(1.06) brightness(1.03);
  }

  #board[data-theme="AURORA"] .cell.light {
    background: rgba(240, 255, 255, 0.04);
  }

  #board[data-theme="AURORA"] .cell.light .cell-file-label,
  #board[data-theme="AURORA"] .cell.light .cell-rank-label {
    color: rgba(222, 246, 255, 0.9);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
  }

  #board[data-theme="AURORA"] .piece.black {
    filter:
      drop-shadow(0 0 0.9px rgba(222, 246, 255, 0.92))
      drop-shadow(0 0 3px rgba(106, 184, 255, 0.52))
      drop-shadow(0 2px 3px rgba(0, 0, 0, 0.72));
  }

  @keyframes aurora-board-drift {
    0% {
      background-position: 8% 22%, 88% 20%, 72% 82%, 18% 76%, 30% 50%;
      filter: saturate(1) brightness(0.95);
    }
    50% {
      background-position: 72% 22%, 26% 78%, 80% 26%, 24% 34%, 64% 50%;
      filter: saturate(1.15) brightness(1.06);
    }
    100% {
      background-position: 88% 78%, 14% 24%, 20% 18%, 80% 76%, 34% 50%;
      filter: saturate(1.04) brightness(0.98);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #board[data-theme="AURORA"]::before {
      animation: none;
    }
  }

  .cell.last-from {
    box-shadow:
      inset 0 0 0 999px rgba(118, 214, 170, 0.36),
      inset 0 0 0 2px rgba(150, 244, 202, 0.58);
  }

  .cell.last-to {
    box-shadow:
      inset 0 0 0 999px rgba(126, 255, 209, 0.42),
      inset 0 0 0 2px rgba(170, 255, 226, 0.62);
  }

  .cell.selected::after {
    content: '';
    position: absolute;
    inset: 8%;
    border: 3px solid #7effd1;
    border-radius: 12%;
    pointer-events: none;
  }

  .cell.legal::before {
    content: '';
    width: 28%;
    height: 28%;
    border-radius: 50%;
    background: rgba(126, 255, 209, 0.8);
    box-shadow: 0 0 12px rgba(126, 255, 209, 0.8);
    position: absolute;
    pointer-events: none;
  }

  .cell.capture::before {
    width: 72%;
    height: 72%;
    background: rgba(255, 102, 102, 0.22);
    border: 3px solid rgba(255, 102, 102, 0.88);
  }

  .cell.in-check::after {
    content: '';
    position: absolute;
    inset: 6%;
    border-radius: 14%;
    border: 3px solid #ff4242;
    box-shadow: 0 0 16px rgba(255, 66, 66, 0.9);
    pointer-events: none;
  }

  .cell.in-danger {

<script>
// ============================================================
// Sound
// ============================================================
let audioCtx = null;
let soundOn = true;
let captureCombo = 0;
let lastCaptureAt = 0;

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function envTone(freq, start, dur, type = 'sine', peak = 0.25, endFreq = null) {
  if (!soundOn) return;
  const ctx = getCtx();
  const t0 = ctx.currentTime + start;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (endFreq != null) osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peak, t0 + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}

function noiseBurst(start, dur, peak = 0.18, filterFreq = 1800) {
  if (!soundOn) return;
  const ctx = getCtx();
  const t0 = ctx.currentTime + start;
  const bufferSize = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = filterFreq;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(peak, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(filter).connect(gain).connect(ctx.destination);
  src.start(t0);
}

function candyPlink(freq = 660, start = 0, brightness = 1) {
  envTone(freq, start, 0.055, 'triangle', 0.11 * brightness, freq * 0.8);
  envTone(freq * 1.98, start + 0.009, 0.05, 'sine', 0.05 * brightness, freq * 1.55);
}

function candySweep(freq = 720, start = 0, rise = 1.35, peak = 0.13) {
  envTone(freq, start, 0.12, 'sine', peak, freq * rise);
  envTone(freq * 0.72, start + 0.014, 0.13, 'triangle', peak * 0.72, freq * (rise * 0.9));

function encodeSquare(r, c) {
  return FILES[c] + String(8 - r);
}

function decodeSquare(square) {
  if (!/^[a-h][1-8]$/.test(square)) return null;
  const c = FILES.indexOf(square[0]);
  const r = 8 - Number(square[1]);
  return { r, c };
}

function stateToFen(state) {
  const rows = [];
  for (let r = 0; r < 8; r++) {
    let run = 0;
    let out = '';
    for (let c = 0; c < 8; c++) {
      const p = state.board[r][c];
      if (!p) {
        run++;
        continue;
      }
      if (run) { out += String(run); run = 0; }
      const sym = p[1];
      out += p[0] === WHITE ? sym.toUpperCase() : sym;
    }
    if (run) out += String(run);
    rows.push(out);
  }
  const boardPart = rows.join('/');
  const turnPart = state.turn;
  let castPart = '';
  if (state.castling.wK) castPart += 'K';
  if (state.castling.wQ) castPart += 'Q';
  if (state.castling.bK) castPart += 'k';
  if (state.castling.bQ) castPart += 'q';
  if (!castPart) castPart = '-';
  const epPart = state.enPassant ? encodeSquare(state.enPassant.r, state.enPassant.c) : '-';
  return `${boardPart} ${turnPart} ${castPart} ${epPart} ${state.halfmoveClock} ${state.fullmoveNumber}`;
}

function fenToState(fen) {
  try {
    const parts = fen.trim().split(/\s+/);
    if (parts.length < 4) return null;
    const [boardPart, turnPart, castPart, epPart, halfPart = '0', fullPart = '1'] = parts;
    const ranks = boardPart.split('/');
    if (ranks.length !== 8) return null;
    const newBoard = [];
    for (const rank of ranks) {
      const row = [];
      for (const ch of rank) {
        if (/[1-8]/.test(ch)) {
          const n = Number(ch);
          for (let i = 0; i < n; i++) row.push(null);
        } else if (/[prnbqkPRNBQK]/.test(ch)) {
          const side = ch === ch.toUpperCase() ? WHITE : BLACK;
          row.push(side + ch.toLowerCase());
        } else {
          return null;
        }
      }
      if (row.length !== 8) return null;
      newBoard.push(row);
    }

    const newTurn = (turnPart === WHITE || turnPart === BLACK) ? turnPart : null;
    if (!newTurn) return null;

    const newCast = {
      wK: castPart.includes('K'),
      wQ: castPart.includes('Q'),
      bK: castPart.includes('k'),
      bQ: castPart.includes('q')
    };

    let newEp = null;
    if (epPart !== '-') {
      const sq = decodeSquare(epPart);
      if (!sq) return null;
      newEp = sq;
    }

    const half = Number(halfPart);
    const full = Number(fullPart);
    if (!Number.isFinite(half) || !Number.isFinite(full)) return null;

    const parsed = {
      board: newBoard,
      turn: newTurn,
      castling: newCast,
      enPassant: newEp,
      halfmoveClock: Math.max(0, Math.floor(half)),
      fullmoveNumber: Math.max(1, Math.floor(full))
    };

    if (!findKing(parsed, WHITE) || !findKing(parsed, BLACK)) return null;
    return parsed;
  } catch {
    return null;
  }
}

function moveToUci(move) {
  const base = encodeSquare(move.fromR, move.fromC) + encodeSquare(move.toR, move.toC);
  return move.promotion ? base + move.promotion : base;
}

function parseUciMove(uci) {
  if (!/^[a-h][1-8][a-h][1-8][qrbn]?$/.test(uci)) return null;
  const from = decodeSquare(uci.slice(0, 2));
  const to = decodeSquare(uci.slice(2, 4));
  if (!from || !to) return null;
  return {
    fromR: from.r,
    fromC: from.c,
    toR: to.r,
    toC: to.c,
    promotion: uci[4] || null
  };
}

function detectOpeningNameFromHistory() {
  if (!moveHistory.length) return 'Ready';
  const sorted = OPENING_BOOK.slice().sort((a, b) => b.moves.length - a.moves.length);
  for (const line of sorted) {
    if (moveHistory.length < line.moves.length) continue;
    let ok = true;
    for (let i = 0; i < line.moves.length; i++) {
      if (moveHistory[i] !== line.moves[i]) {
        ok = false;
        break;
      }
    }
    if (ok) return line.name;
  }
  return moveHistory.length < 2 ? 'Developing...' : 'Offbook Line';
}

function toCompactNotation(move, piece, capturedPiece) {
  if (!move || !piece) return '';
  if (move.isCastle === 'K') return 'O-O';
  if (move.isCastle === 'Q') return 'O-O-O';
  const type = pieceType(piece);
  const capture = !!capturedPiece || !!move.isEnPassant;
  const dst = encodeSquare(move.toR, move.toC);

  if (type === 'p') {
    const promo = move.promotion ? `=${move.promotion.toUpperCase()}` : '';
    return capture ? `${FILES[move.fromC]}x${dst}${promo}` : `${dst}${promo}`;
  }

  const pieceMap = { n: 'N', b: 'B', r: 'R', q: 'Q', k: 'K' };
  const lead = pieceMap[type] || '';
  return `${lead}${capture ? 'x' : ''}${dst}`;
}

function buildMoveNotationHistory() {
  const out = [];
  let state = {
    board: createInitialBoard(),
    turn: WHITE,
    castling: { wK: true, wQ: true, bK: true, bQ: true },
    enPassant: null,
    halfmoveClock: 0,
    fullmoveNumber: 1
  };

  for (const uci of moveHistory) {
    const template = parseUciMove(uci);
    if (!template) break;
    const legal = generateLegalMoves(state, state.turn);
    const exact = legal.find(m => moveMatchesTemplate(m, template));
    if (!exact) break;

    const moving = state.board[exact.fromR][exact.fromC];
    const captured = exact.isEnPassant
      ? state.board[state.turn === WHITE ? exact.toR + 1 : exact.toR - 1][exact.toC]
      : state.board[exact.toR][exact.toC];
    let note = toCompactNotation(exact, moving, captured);
    const next = applyMoveToState(state, exact);
    const givesCheck = isKingInCheck(next, next.turn);
    if (givesCheck) {
      const replies = generateLegalMoves(next, next.turn);
      note += replies.length ? '+' : '#';
    }
    out.push(note);
    state = next;
  }

  return out;
}

    const chip = document.createElement('div');
    chip.className = 'move-chip';
    const moveNo = Math.floor(i / 2) + 1;
    const white = notes[i] || '';
    const black = notes[i + 1] || '';
    chip.innerHTML = `<span class="n">${moveNo}.</span><span class="w">${white}</span>${black ? `<span class="b">${black}</span>` : ''}`;
    if (i + 1 >= notes.length - 1) chip.classList.add('latest');
    tape.appendChild(chip);
  }

  tape.scrollTop = tape.scrollHeight;
}

function positionInsightsNearBoard() {
  const insights = document.getElementById('game-insights');
  if (!insights) return;
  if (!onePlayer || window.innerWidth <= 700) {
    insights.classList.add('hidden');
    insights.style.left = '';
    insights.style.top = '';
    return;
  }

  const boardEl = document.getElementById('board');
  if (!boardEl) return;
  const boardRect = boardEl.getBoundingClientRect();
  if (boardRect.width < 20 || boardRect.height < 20) return;

  const cpuSide = getCpuSide();
  if (!cpuSide) {
    insights.classList.add('hidden');
    return;
  }

  insights.classList.remove('hidden');
  const placeLeft = cpuSide === WHITE;
  const panelRect = insights.getBoundingClientRect();
  const panelW = Math.max(130, panelRect.width || insights.offsetWidth || 150);
  const panelH = Math.max(120, panelRect.height || insights.offsetHeight || 160);
  const gap = 14;

  let rawX = placeLeft ? (boardRect.left - gap - panelW) : (boardRect.right + gap);
  let rawY = boardRect.top + 4;

  rawX = Math.max(8, Math.min(window.innerWidth - 8 - panelW, rawX));
  rawY = Math.max(8, Math.min(window.innerHeight - 8 - panelH, rawY));

  insights.style.left = `${Math.round(rawX)}px`;
  insights.style.top = `${Math.round(rawY)}px`;
}

function findKing(state, side) {
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if (state.board[r][c] === side + 'k') return { r, c };
    }
  }
  return null;
}

function isSquareAttacked(state, r, c, bySide) {
  const b = state.board;
  const pawnDir = bySide === WHITE ? -1 : 1;
  for (const dc of [-1, 1]) {
    const pr = r - pawnDir;
    const pc = c + dc;
    if (inBounds(pr, pc) && b[pr][pc] === bySide + 'p') return true;
  }

  const knightSteps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
  for (const [dr, dc] of knightSteps) {
    const nr = r + dr, nc = c + dc;
    if (inBounds(nr, nc) && b[nr][nc] === bySide + 'n') return true;
  }

  const lineDirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for (const [dr, dc] of lineDirs) {
    let nr = r + dr, nc = c + dc;
    while (inBounds(nr, nc)) {
      const p = b[nr][nc];
      if (p) {
        if (pieceSide(p) === bySide && (pieceType(p) === 'r' || pieceType(p) === 'q')) return true;
        break;
      }
      nr += dr;
      nc += dc;
    }
  }

  const diagDirs = [[1,1],[1,-1],[-1,1],[-1,-1]];
  for (const [dr, dc] of diagDirs) {
    let nr = r + dr, nc = c + dc;
    while (inBounds(nr, nc)) {
      const p = b[nr][nc];
      if (p) {
        if (pieceSide(p) === bySide && (pieceType(p) === 'b' || pieceType(p) === 'q')) return true;
        break;
      }
      nr += dr;
      nc += dc;
    }
  }

  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (inBounds(nr, nc) && b[nr][nc] === bySide + 'k') return true;
    }
  }

  return false;
}

function isKingInCheck(state, side) {
  const king = findKing(state, side);
  if (!king) return false;
  return isSquareAttacked(state, king.r, king.c, otherSide(side));
}

function threatenedSquaresForSide(state, side) {
  const threatened = [];
  const attackerSide = otherSide(side);
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const piece = state.board[r][c];
      if (!piece || pieceSide(piece) !== side) continue;
      if (pieceType(piece) === 'k') continue;
      if (isSquareAttacked(state, r, c, attackerSide)) threatened.push({ r, c });
    }
  }
  return threatened;
}

function createMove(fromR, fromC, toR, toC, extra = {}) {
  return { fromR, fromC, toR, toC, ...extra };
}

function generatePseudoMoves(state, side) {
  const moves = [];
  const b = state.board;

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = b[r][c];
      if (!p || pieceSide(p) !== side) continue;
      const t = pieceType(p);

      if (t === 'p') {
        const dir = side === WHITE ? -1 : 1;
        const startRow = side === WHITE ? 6 : 1;
        const promoRow = side === WHITE ? 0 : 7;

        const oneR = r + dir;
        if (inBounds(oneR, c) && !b[oneR][c]) {
          if (oneR === promoRow) {
            for (const promo of ['q', 'r', 'b', 'n']) moves.push(createMove(r, c, oneR, c, { promotion: promo }));
          } else {
            moves.push(createMove(r, c, oneR, c));
          }
          const twoR = r + dir * 2;
          if (r === startRow && !b[twoR][c]) moves.push(createMove(r, c, twoR, c, { isDoublePawn: true }));
        }

        for (const dc of [-1, 1]) {
          const cr = r + dir, cc = c + dc;
          if (!inBounds(cr, cc)) continue;
          const target = b[cr][cc];
          if (target && pieceSide(target) !== side) {
            if (cr === promoRow) {
              for (const promo of ['q', 'r', 'b', 'n']) moves.push(createMove(r, c, cr, cc, { promotion: promo }));
            } else {
              moves.push(createMove(r, c, cr, cc));
            }
          }
        }

        if (state.enPassant) {
          const ep = state.enPassant;
          if (ep.r === r + dir && Math.abs(ep.c - c) === 1) {
            moves.push(createMove(r, c, ep.r, ep.c, { isEnPassant: true }));
          }
        }
      }

      if (t === 'n') {
        const steps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
        for (const [dr, dc] of steps) {
          const nr = r + dr, nc = c + dc;
          if (!inBounds(nr, nc)) continue;
          const target = b[nr][nc];
          if (!target || pieceSide(target) !== side) moves.push(createMove(r, c, nr, nc));
        }
      }

      if (t === 'b' || t === 'r' || t === 'q') {
        const dirs = [];
        if (t === 'b' || t === 'q') dirs.push([1,1],[1,-1],[-1,1],[-1,-1]);
        if (t === 'r' || t === 'q') dirs.push([1,0],[-1,0],[0,1],[0,-1]);
        for (const [dr, dc] of dirs) {
          let nr = r + dr, nc = c + dc;
          while (inBounds(nr, nc)) {
            const target = b[nr][nc];
            if (!target) {
              moves.push(createMove(r, c, nr, nc));
            } else {
              if (pieceSide(target) !== side) moves.push(createMove(r, c, nr, nc));
              break;
            }
            nr += dr;
            nc += dc;
          }
        }
      }

      if (t === 'k') {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (!inBounds(nr, nc)) continue;
            const target = b[nr][nc];
            if (!target || pieceSide(target) !== side) moves.push(createMove(r, c, nr, nc));
          }
        }

        if (side === WHITE && r === 7 && c === 4) {
          if (state.castling.wK && !b[7][5] && !b[7][6]) moves.push(createMove(r, c, 7, 6, { isCastle: 'K' }));
          if (state.castling.wQ && !b[7][3] && !b[7][2] && !b[7][1]) moves.push(createMove(r, c, 7, 2, { isCastle: 'Q' }));
        }
        if (side === BLACK && r === 0 && c === 4) {
          if (state.castling.bK && !b[0][5] && !b[0][6]) moves.push(createMove(r, c, 0, 6, { isCastle: 'K' }));
          if (state.castling.bQ && !b[0][3] && !b[0][2] && !b[0][1]) moves.push(createMove(r, c, 0, 2, { isCastle: 'Q' }));
        }
      }
    }
  }

  return moves;
}

function applyMoveToState(state, move) {
  const next = {
    board: state.board.map(row => row.slice()),
    turn: otherSide(state.turn),
    castling: { ...state.castling },
    enPassant: null,
    halfmoveClock: state.halfmoveClock + 1,
    fullmoveNumber: state.turn === BLACK ? state.fullmoveNumber + 1 : state.fullmoveNumber
  };

  const piece = next.board[move.fromR][move.fromC];
  const side = pieceSide(piece);
  const type = pieceType(piece);
  const target = next.board[move.toR][move.toC];

  if (target || type === 'p') next.halfmoveClock = 0;

  next.board[move.fromR][move.fromC] = null;

  if (move.isEnPassant) {
    const capR = side === WHITE ? move.toR + 1 : move.toR - 1;
    next.board[capR][move.toC] = null;
  }

  if (move.isCastle) {
    if (side === WHITE) {
      if (move.isCastle === 'K') {
        next.board[7][6] = 'wk';
        next.board[7][5] = 'wr';
        next.board[7][7] = null;
      } else {
        next.board[7][2] = 'wk';
        next.board[7][3] = 'wr';
        next.board[7][0] = null;
      }
      next.castling.wK = false;
      next.castling.wQ = false;
    } else {
      if (move.isCastle === 'K') {
        next.board[0][6] = 'bk';
        next.board[0][5] = 'br';
        next.board[0][7] = null;
      } else {
        next.board[0][2] = 'bk';
        next.board[0][3] = 'br';
        next.board[0][0] = null;
      }
      next.castling.bK = false;
      next.castling.bQ = false;
    }
  } else {
    const outPiece = move.promotion ? (side + move.promotion) : piece;
    next.board[move.toR][move.toC] = outPiece;
  }

  if (type === 'p' && Math.abs(move.toR - move.fromR) === 2) {
    next.enPassant = { r: (move.toR + move.fromR) / 2, c: move.fromC };
  }

  if (piece === 'wk') { next.castling.wK = false; next.castling.wQ = false; }
  if (piece === 'bk') { next.castling.bK = false; next.castling.bQ = false; }
  if (piece === 'wr' && move.fromR === 7 && move.fromC === 0) next.castling.wQ = false;
  if (piece === 'wr' && move.fromR === 7 && move.fromC === 7) next.castling.wK = false;
  if (piece === 'br' && move.fromR === 0 && move.fromC === 0) next.castling.bQ = false;
  if (piece === 'br' && move.fromR === 0 && move.fromC === 7) next.castling.bK = false;

  if (target === 'wr' && move.toR === 7 && move.toC === 0) next.castling.wQ = false;
  if (target === 'wr' && move.toR === 7 && move.toC === 7) next.castling.wK = false;
  if (target === 'br' && move.toR === 0 && move.toC === 0) next.castling.bQ = false;
  if (target === 'br' && move.toR === 0 && move.toC === 7) next.castling.bK = false;

  return next;
}

function generateLegalMoves(state, side = state.turn) {
  const pseudo = generatePseudoMoves(state, side);
  const out = [];

  for (const mv of pseudo) {
    const moving = state.board[mv.fromR][mv.fromC];
    if (!moving || pieceSide(moving) !== side) continue;

    if (mv.isCastle) {
      if (isKingInCheck(state, side)) continue;
      const through = mv.isCastle === 'K' ? 5 : 3;
      const dest = mv.isCastle === 'K' ? 6 : 2;
      const row = side === WHITE ? 7 : 0;
      if (isSquareAttacked(state, row, through, otherSide(side))) continue;
      if (isSquareAttacked(state, row, dest, otherSide(side))) continue;
      const rookFile = mv.isCastle === 'K' ? 7 : 0;
      const rook = state.board[row][rookFile];
      if (rook !== side + 'r') continue;
    }

    const next = applyMoveToState(state, mv);
    if (!isKingInCheck(next, side)) out.push(mv);
  }

  return out;
}

function legalMovesFrom(r, c) {
  const state = cloneState();
  const all = generateLegalMoves(state, turn);
  return all.filter(m => m.fromR === r && m.fromC === c);
}

function pseudoMovesFrom(state, side, r, c) {
  return generatePseudoMoves(state, side).filter(m => m.fromR === r && m.fromC === c);
}

function isPinnedPiece(state, side, r, c) {
  const piece = state.board[r][c];
  if (!piece || pieceSide(piece) !== side || pieceType(piece) === 'k') return false;
  if (isKingInCheck(state, side)) return false;
  const probe = {
    board: state.board.map(row => row.slice()),
    turn: state.turn,
    castling: { ...state.castling },
    enPassant: state.enPassant ? { ...state.enPassant } : null,
    halfmoveClock: state.halfmoveClock,
    fullmoveNumber: state.fullmoveNumber
  };
  probe.board[r][c] = null;
  return isKingInCheck(probe, side);
}

function evaluateState(state) {
  let score = 0;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = state.board[r][c];
      if (!p) continue;
      const v = PIECE_VALUE[pieceType(p)] || 0;
      score += pieceSide(p) === WHITE ? v : -v;
    }
  }

  const whiteMoves = generateLegalMoves(state, WHITE).length;
  const blackMoves = generateLegalMoves(state, BLACK).length;
  score += (whiteMoves - blackMoves) * 0.8;

  return score;
}

function shuffleInPlace(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i];
    arr[i] = arr[j];
    arr[j] = t;
  }
}

function scoreMoveHeuristic(state, move) {
  const from = state.board[move.fromR][move.fromC];
  const to = state.board[move.toR][move.toC];
  let score = 0;
  if (to) score += 10 * PIECE_VALUE[pieceType(to)] - PIECE_VALUE[pieceType(from)];
  if (move.isEnPassant) score += 95;
  if (move.promotion) score += 850;
  if (move.isCastle) score += 40;
  return score;
}

function negamax(state, depth, alpha, beta, sideSign) {
  const legal = generateLegalMoves(state, state.turn);
  const inCheck = isKingInCheck(state, state.turn);

  if (depth === 0) return sideSign * evaluateState(state);
  if (legal.length === 0) {
    if (inCheck) return -999999 + (4 - depth);
    return 0;
  }

  legal.sort((a, b) => scoreMoveHeuristic(state, b) - scoreMoveHeuristic(state, a));

  let best = -Infinity;
  for (const mv of legal) {
    const next = applyMoveToState(state, mv);
    const val = -negamax(next, depth - 1, -beta, -alpha, -sideSign);
    if (val > best) best = val;
    if (best > alpha) alpha = best;
    if (alpha >= beta) break;
  }
  return best;
}

function aiChooseMove() {
  const state = cloneState();
  const legal = generateLegalMoves(state, turn);
  if (!legal.length) return null;

  if (difficulty === 'ROOKIE') {
    const captures = legal.filter(m => !!board[m.toR][m.toC] || m.isEnPassant);
    const pool = captures.length ? captures : legal;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  let depth = difficulty === 'MASTER' ? 3 : 2;
  if (legal.length <= 12 && difficulty === 'MASTER') depth = 4;
  if (legal.length >= 36 && depth > 2) depth = 3;

  const sideSign = turn === WHITE ? 1 : -1;
  const ranked = legal.map(mv => {
    const next = applyMoveToState(state, mv);
    const val = -negamax(next, depth - 1, -Infinity, Infinity, -sideSign);
    return { mv, val };
  });

  ranked.sort((a, b) => b.val - a.val);

  if (difficulty === 'PRO') {
    const top = ranked.slice(0, Math.min(3, ranked.length));
    const jittered = top.map(entry => ({ ...entry, pick: entry.val + Math.random() * 24 }));
    jittered.sort((a, b) => b.pick - a.pick);
    return jittered[0].mv;
  }

  return ranked[0].mv;
}

function formatSide(side) {
  return side === WHITE ? 'WHITE' : 'BLACK';
}

function loadPreferredBoardTheme() {
  try {
    const v = localStorage.getItem(BOARD_THEME_STORAGE_KEY);
    if (v && BOARD_THEMES[v]) return v;
  } catch {}
  return 'AURORA';
}

function applyBoardTheme(themeKey, persist = true) {
  const key = BOARD_THEMES[themeKey] ? themeKey : 'CLASSIC';
  const theme = BOARD_THEMES[key];
  const boardEl = document.getElementById('board');
  const root = document.documentElement;
  root.style.setProperty('--board-frame-bg', theme.frameBg);
  root.style.setProperty('--board-frame-border', theme.frameBorder);
  root.style.setProperty('--board-frame-glow', theme.frameGlow);
  root.style.setProperty('--board-light', theme.light);
  root.style.setProperty('--board-dark', theme.dark);
  if (boardEl) boardEl.dataset.theme = key;
  const select = document.getElementById('board-theme-btn');
  if (select && select.value !== key) select.value = key;
  if (persist) {
    try { localStorage.setItem(BOARD_THEME_STORAGE_KEY, key); } catch {}
  }
}

function getCpuSide() {
  if (!onePlayer) return null;
  return otherSide(humanSide);
}

function clearCpuBoardsidePlacement() {
  const avatars = document.querySelectorAll('.cpu-avatar');
  avatars.forEach((avatar) => {
    avatar.classList.remove('cpu-boardside');
    avatar.style.left = '';
    avatar.style.top = '';
    avatar.style.transform = '';
  });
}

function positionCpuAvatarNearBoard() {
  clearCpuBoardsidePlacement();
  const cpuSide = getCpuSide();
  if (!cpuSide) return;
  const boardEl = document.getElementById('board');
  if (!boardEl) return;
  const boardRect = boardEl.getBoundingClientRect();
  if (boardRect.width < 20 || boardRect.height < 20) return;

  const avatar = cpuSide === BLACK
    ? document.querySelector('#panel-left .cpu-avatar')
    : document.querySelector('#panel-right .cpu-avatar');
  if (!avatar) return;

  avatar.classList.add('cpu-boardside');

  // Measure after boardside class so we can keep it on-screen.
  const measured = avatar.getBoundingClientRect();
  const avatarW = Math.max(74, measured.width || avatar.offsetWidth || 96);
  const avatarH = Math.max(74, measured.height || avatar.offsetHeight || 96);

  const square = boardRect.width / 8;
  const isMobile = window.innerWidth <= 700;

  if (isMobile) {
    // Mobile: keep CPU anchored close to the board but not over squares.
    // Black CPU sits above-left; White CPU sits below-right.
    const rawX = cpuSide === BLACK
      ? (boardRect.left + square * 0.45)
      : (boardRect.right - square * 0.45);
    const rawY = cpuSide === BLACK
      ? (boardRect.top - 10 - avatarH * 0.5)
      : (boardRect.bottom + 10 + avatarH * 0.5);

    const minX = 8 + avatarW * 0.5;
    const maxX = window.innerWidth - 8 - avatarW * 0.5;
    const minY = 8 + avatarH * 0.5;
    const maxY = window.innerHeight - 8 - avatarH * 0.5;

    const anchorX = Math.max(minX, Math.min(maxX, rawX));
    const anchorY = Math.max(minY, Math.min(maxY, rawY));

    avatar.style.left = `${Math.round(anchorX)}px`;
    avatar.style.top = `${Math.round(anchorY)}px`;
    avatar.style.transform = 'translate(-50%, -50%)';
    return;
  }

  const rawY = cpuSide === BLACK
    ? (boardRect.top + square * 0.5)
    : (boardRect.bottom - square * 0.5);

  const rawX = cpuSide === BLACK
    ? (boardRect.left - 12)
    : (boardRect.right + 12);

  const minY = 8 + avatarH / 2;
  const maxY = window.innerHeight - 8 - avatarH / 2;
  const anchorY = Math.max(minY, Math.min(maxY, rawY));

  let anchorX = rawX;
  if (cpuSide === BLACK) {
    // Left-side avatar uses translate(-100%, -50%) so left is right-edge anchor.
    const minRightEdge = 8 + avatarW;
    const maxRightEdge = window.innerWidth - 8;
    anchorX = Math.max(minRightEdge, Math.min(maxRightEdge, rawX));
  } else {
    // Right-side avatar uses translate(0, -50%) so left is left-edge anchor.
    const minLeftEdge = 8;
    const maxLeftEdge = window.innerWidth - 8 - avatarW;
    anchorX = Math.max(minLeftEdge, Math.min(maxLeftEdge, rawX));
  }

  avatar.style.left = `${Math.round(anchorX)}px`;
  avatar.style.top = `${Math.round(anchorY)}px`;
  avatar.style.transform = cpuSide === BLACK
    ? 'translate(-100%, -50%)'
    : 'translate(0, -50%)';
}

function setCpuFaceVisibility() {
  const cpuSide = getCpuSide();
  const showLeft = cpuSide === BLACK;
  const showRight = cpuSide === WHITE;
  document.getElementById('cpu-face-left').classList.toggle('hidden', !showLeft);
  document.getElementById('cpu-face-right').classList.toggle('hidden', !showRight);
  updateCpuPanelProminence();
  requestAnimationFrame(() => {
    positionCpuAvatarNearBoard();
    positionInsightsNearBoard();
  });
}

function setCpuChatVisibility() {
  const cpuSide = getCpuSide();
  const showLeft = cpuSide === BLACK;
  const showRight = cpuSide === WHITE;
  document.getElementById('cpu-chat-left').classList.toggle('hidden', !showLeft);
  document.getElementById('cpu-chat-right').classList.toggle('hidden', !showRight);
}

function updateCpuPanelProminence() {
  const leftPanel = document.getElementById('panel-left');
  const rightPanel = document.getElementById('panel-right');
  const cpuSide = getCpuSide();
  leftPanel.classList.toggle('cpu-focus', cpuSide === BLACK);
  rightPanel.classList.toggle('cpu-focus', cpuSide === WHITE);
}

function setCpuEmotion(emotion) {
  const faceId = getCpuSide() === WHITE ? 'cpu-face-right' : 'cpu-face-left';
  const face = document.getElementById(faceId);
  if (!face) return;
  face.setAttribute('data-emotion', emotion);
}

function getCpuMoodEmotion() {
  if (cpuMood === 'smug') return 'smug';
  if (cpuMood === 'annoyed') return 'annoyed';
  if (cpuMood === 'rattled') return 'surprised';
  return 'focused';
}

function setCpuMood(nextMood, turns = 2) {
  cpuMood = nextMood;
  cpuMoodTurnsLeft = Math.max(0, turns);
  setCpuEmotion(getCpuMoodEmotion());
}

function tickCpuMoodTurn() {
  if (cpuMoodTurnsLeft > 0) {
    cpuMoodTurnsLeft--;
    if (cpuMoodTurnsLeft === 0) cpuMood = 'focused';
  }
}

function scoreForSide(state, side) {
  const evalWhite = evaluateState(state);
  return side === WHITE ? evalWhite : -evalWhite;
}

function materialPhase(state) {
  let sum = 0;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = state.board[r][c];
      if (!p || pieceType(p) === 'k') continue;
      sum += PIECE_VALUE[pieceType(p)] || 0;
    }
  }
  if (sum > 6200) return 'opening';
  if (sum > 3200) return 'middlegame';
  return 'endgame';
}

function countValuableTargetsFrom(state, side, fromR, fromC) {
  const pseudo = generatePseudoMoves(state, side).filter(m => m.fromR === fromR && m.fromC === fromC);
  const seen = new Set();
  for (const mv of pseudo) {
    const target = state.board[mv.toR][mv.toC];
    if (!target || pieceSide(target) === side) continue;
    if ((PIECE_VALUE[pieceType(target)] || 0) < 300) continue;
    seen.add(`${mv.toR},${mv.toC}`);
  }
  return seen.size;
}

function updateHumanPattern(movedType) {
  if (movedType === 'p') cpuPlayerPattern.pawnPushStreak++;
  else cpuPlayerPattern.pawnPushStreak = 0;
  if (movedType === 'n') cpuPlayerPattern.knightHopStreak++;
  else cpuPlayerPattern.knightHopStreak = 0;
}

function cpuPickLine(bucket) {
  const lines = CPU_PERSONA_LINES[bucket];
  if (!lines || !lines.length) return null;
  let pickFrom = lines;
  let usedSignature = false;
  const signatureEligible = new Set([
    'taunt', 'cocky', 'blunder', 'strong', 'checkGiven', 'checkTaken', 'capture', 'fork', 'slow2', 'slow3'
  ]);

  if (signatureEligible.has(bucket) && cpuSignatureCooldown <= 0 && Math.random() < CPU_SIGNATURE_CHANCE) {
    pickFrom = CPU_PERSONA_LINES.signature;
    usedSignature = true;
  }

  const pool = pickFrom.filter(line => line !== cpuLastLine);
  const line = (pool.length ? pool : pickFrom)[Math.floor(Math.random() * (pool.length ? pool.length : pickFrom.length))];
  cpuLastLine = line;

  if (usedSignature) cpuSignatureCooldown = 4;
  else if (cpuSignatureCooldown > 0) cpuSignatureCooldown--;

  return line;
}

function emotionForTone(tone) {
  if (tone === 'taunt') return cpuMood === 'annoyed' ? 'annoyed' : 'smug';
  if (tone === 'sad') return 'annoyed';
  if (tone === 'hype') return 'focused';
  return getCpuMoodEmotion();
}

function cpuSay(bucket, tone = 'hype', opts = {}) {
  if (!onePlayer) return;
  const text = cpuPickLine(bucket);
  if (!text) return;
  const bubbleId = getCpuSide() === WHITE ? 'cpu-chat-right' : 'cpu-chat-left';
  const bubble = document.getElementById(bubbleId);
  if (!bubble) return;
  bubble.textContent = text;
  bubble.dataset.tone = tone;
  bubble.classList.remove('hidden');
  setCpuEmotion(opts.emotion || emotionForTone(tone));
  if (cpuSpeechTimer) clearTimeout(cpuSpeechTimer);
  cpuSpeechTimer = setTimeout(() => {
    bubble.classList.add('hidden');
    setCpuEmotion(getCpuMoodEmotion());
  }, CPU_CHAT_DURATION_MS);
}

  if (cpuTauntRepeatTimer) clearInterval(cpuTauntRepeatTimer);
  cpuTauntStartTimer = null;

  cpuTauntStageThreeTimer = null;

}

function isOverlayVisible(id) {

}

function shouldCpuTauntNow() {
  if (!onePlayer || gameOver || busy) return false;
  if (turn !== humanSide) return false;
  if (document.hidden) return false;
  if (isOverlayVisible('mode-select')) return false;
  if (isOverlayVisible('ready-overlay')) return false;
  if (isOverlayVisible('cpu-side-select')) return false;
  if (isOverlayVisible('async-turn-overlay')) return false;
  if (isOverlayVisible('match-end')) return false;

function fireCpuSlowTurnTaunt(stage = 1) {
  if (stage === 1) {
    cpuSay('slow1', 'taunt');
    return;
  }
  if (stage === 2) {
    if (cpuPlayerPattern.pawnPushStreak >= 2) {
      cpuSay('memoryPawn', 'taunt');
      return;
    }
    if (cpuPlayerPattern.knightHopStreak >= 2) {
      cpuSay('memoryKnight', 'taunt');
      return;
    }
    cpuSay('slow2', 'taunt');
    return;
  }
  cpuSay('slow3', 'taunt');
}

function refreshCpuTauntLoop() {
  clearCpuTauntTimers();
  if (!shouldCpuTauntNow()) return;

  cpuTauntStartTimer = setTimeout(() => {
    if (!shouldCpuTauntNow()) return;
    fireCpuSlowTurnTaunt(1);
  }, CPU_TAUNT_START_MS);

  cpuTauntStageTwoTimer = setTimeout(() => {
    if (!shouldCpuTauntNow()) return;
    fireCpuSlowTurnTaunt(2);
  }, CPU_TAUNT_STAGE_TWO_MS);

  cpuTauntStageThreeTimer = setTimeout(() => {
    if (!shouldCpuTauntNow()) return;
    fireCpuSlowTurnTaunt(3);
    cpuTauntRepeatTimer = setInterval(() => {
      if (!shouldCpuTauntNow()) {
        clearCpuTauntTimers();
        return;
      }
      fireCpuSlowTurnTaunt(Math.random() < 0.65 ? 3 : 2);
    }, CPU_TAUNT_REPEAT_MS);
  }, CPU_TAUNT_STAGE_THREE_MS);
}

function reactCpuPersonaToMove(ctx) {
  if (!onePlayer || gameOver) return;
  const cpuSide = getCpuSide();
  if (!cpuSide) return;

  const movedType = pieceType(ctx.sourcePiece);
  const phase = materialPhase(ctx.nextState);

  if (ctx.moverSide === humanSide) {
    updateHumanPattern(movedType);
    const humanDelta = scoreForSide(ctx.nextState, humanSide) - scoreForSide(ctx.prevState, humanSide);
    const humanFork = countValuableTargetsFrom(ctx.nextState, humanSide, ctx.move.toR, ctx.move.toC) >= 2;

    if (ctx.move.promotion) {
      setCpuMood('rattled', 3);
      cpuSay('promotion', 'sad', { emotion: 'surprised' });
      return;
    }
    if (ctx.deliveredCheck) {
      setCpuMood('annoyed', 2);
      cpuSay('checkTaken', 'sad', { emotion: 'annoyed' });
      return;
    }
    if (humanFork) {
      setCpuMood('rattled', 3);
      cpuSay('fork', 'sad', { emotion: 'surprised' });
      return;
    }
    if (humanDelta >= 120) {
      setCpuMood('annoyed', 2);
      cpuSay('strong', 'hype');
      return;
    }
    if (humanDelta <= -130) {
      setCpuMood('smug', 3);
      cpuSay('blunder', 'taunt');
      return;
    }
    if (cpuPlayerPattern.pawnPushStreak >= 3 && Math.random() < 0.55) {
      cpuSay('memoryPawn', 'taunt');
      return;
    }
    if (cpuPlayerPattern.knightHopStreak >= 2 && Math.random() < 0.6) {
      cpuSay('memoryKnight', 'taunt');
      return;
    }
    if (Math.random() < 0.28) cpuSay(phase, 'hype');
    return;
  }

  const cpuFork = countValuableTargetsFrom(ctx.nextState, cpuSide, ctx.move.toR, ctx.move.toC) >= 2;
  const cpuDelta = scoreForSide(ctx.nextState, cpuSide) - scoreForSide(ctx.prevState, cpuSide);

  if (ctx.move.promotion) {
    setCpuMood('smug', 3);
    cpuSay('promotion', 'taunt');
    return;
  }
  if (ctx.deliveredCheck) {
    setCpuMood('smug', 2);
    cpuSay('checkGiven', 'taunt');
    return;
  }
  if (cpuFork) {
    setCpuMood('smug', 3);
    cpuSay('fork', 'taunt');
    return;
  }
  if (ctx.targetPiece || ctx.move.isEnPassant) {
    if (cpuDelta > 60) setCpuMood('smug', 2);
    cpuSay('capture', cpuDelta > 60 ? 'taunt' : 'hype');
    return;
  }
  if (cpuDelta > 110 && Math.random() < 0.7) {
    setCpuMood('smug', 2);
    cpuSay('cocky', 'taunt');
    return;
  }
  if (Math.random() < 0.26) cpuSay(phase, 'hype');
}

function getCell(r, c) {
  return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
}

function pathSquaresLinear(fromR, fromC, toR, toC) {
  const dr = Math.sign(toR - fromR);
  const dc = Math.sign(toC - fromC);
  const out = [];
  let r = fromR + dr;
  let c = fromC + dc;
  while (r !== toR || c !== toC) {
    out.push({ r, c });
    r += dr;
    c += dc;
  }
  out.push({ r: toR, c: toC });
  return out;
}

function pathSquaresForMove(move, movingPiece) {
  const type = pieceType(movingPiece);
  const dr = move.toR - move.fromR;
  const dc = move.toC - move.fromC;

  if (type === 'n') {
    if (Math.abs(dr) === 2) {
      return [
        { r: move.fromR + Math.sign(dr), c: move.fromC },
        { r: move.fromR + Math.sign(dr) * 2, c: move.fromC },
        { r: move.toR, c: move.toC }
      ];
    }
    return [
      { r: move.fromR, c: move.fromC + Math.sign(dc) },
      { r: move.fromR, c: move.fromC + Math.sign(dc) * 2 },
      { r: move.toR, c: move.toC }
    ];
  }

  return pathSquaresLinear(move.fromR, move.fromC, move.toR, move.toC);
}

function squareCenter(r, c) {
  const cell = getCell(r, c);
  if (!cell) return null;
  const rect = cell.getBoundingClientRect();
  return {
    x: rect.left + rect.width / 2,
    y: rect.top + rect.height / 2
  };
}

function createMoveGhost(pieceKey, sourceImg, startCenter) {
  const ghost = document.createElement('img');
  ghost.className = 'move-anim-piece piece ' + (pieceSide(pieceKey) === WHITE ? 'white' : 'black');
  ghost.src = PIECE_SVGS[pieceKey];
  ghost.alt = pieceKey;
  ghost.draggable = false;
  const srcRect = sourceImg ? sourceImg.getBoundingClientRect() : null;
  const size = srcRect ? Math.max(srcRect.width, srcRect.height) : 54;
  ghost.style.width = `${Math.round(size)}px`;
  ghost.style.height = `${Math.round(size)}px`;
  ghost.style.left = `${Math.round(startCenter.x)}px`;
  ghost.style.top = `${Math.round(startCenter.y)}px`;
  document.body.appendChild(ghost);
  return ghost;
}

async function animateGhostAlongPoints(ghost, points) {
  if (!ghost || !points || points.length < 2) return;
  const segments = points.length - 1;
  const duration = Math.max(180, Math.min(860, segments * 130));

  const lengths = [];
  const cumulative = [0];
  let totalLength = 0;
  for (let i = 0; i < segments; i++) {
    const dx = points[i + 1].x - points[i].x;
    const dy = points[i + 1].y - points[i].y;
    const len = Math.hypot(dx, dy);
    lengths.push(len);
    totalLength += len;
    cumulative.push(totalLength);
  }
  if (totalLength < 1) return;

  const spawnTrail = (x, y) => {
    const trail = ghost.cloneNode(false);
    trail.className = `move-anim-trail piece ${pieceSide(ghost.alt) === WHITE ? 'white' : 'black'}`;
    trail.src = ghost.src;
    trail.alt = '';
    trail.style.width = ghost.style.width;
    trail.style.height = ghost.style.height;
    trail.style.left = `${x}px`;
    trail.style.top = `${y}px`;
    document.body.appendChild(trail);

    const fade = trail.animate(
      [
        { opacity: 0.32, transform: 'translate(-50%, -50%) scale(0.98)' },
        { opacity: 0.12, transform: 'translate(-50%, -50%) scale(0.9)' },
        { opacity: 0, transform: 'translate(-50%, -50%) scale(0.76)' }
      ],
      {
        duration: 360,
        easing: 'cubic-bezier(0.2, 0.7, 0.2, 1)',
        fill: 'forwards'
      }
    );
    fade.finished.finally(() => trail.remove());
  };

  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

  await new Promise((resolve) => {
    const start = performance.now();
    let lastTrailTs = start - 999;

    const frame = (now) => {
      const rawT = Math.min(1, (now - start) / duration);
      const t = easeOutCubic(rawT);
      const targetDist = t * totalLength;

      let segIndex = 0;
      while (segIndex < segments - 1 && cumulative[segIndex + 1] < targetDist) segIndex++;

      const segStart = points[segIndex];
      const segEnd = points[segIndex + 1];
      const segLen = Math.max(1, lengths[segIndex]);
      const segDist = targetDist - cumulative[segIndex];
      const localT = Math.max(0, Math.min(1, segDist / segLen));

      const x = segStart.x + (segEnd.x - segStart.x) * localT;
      const y = segStart.y + (segEnd.y - segStart.y) * localT;
      ghost.style.left = `${x}px`;
      ghost.style.top = `${y}px`;

      if (now - lastTrailTs >= 12 || rawT === 1) {
        spawnTrail(x, y);
        lastTrailTs = now;
      }

      if (rawT < 1) {
        requestAnimationFrame(frame);
      } else {
        resolve();
      }
    };

    requestAnimationFrame(frame);
  });
}

async function animateSinglePieceMove(pieceKey, fromR, fromC, pathSquares) {
  const start = squareCenter(fromR, fromC);
  if (!start) return;
  const sourceCell = getCell(fromR, fromC);
  const sourceImg = sourceCell ? sourceCell.querySelector('.piece') : null;
  if (sourceImg) sourceImg.style.visibility = 'hidden';

  const points = [start];
  for (const sq of pathSquares) {
    const center = squareCenter(sq.r, sq.c);
    if (center) points.push(center);
  }

  const ghost = createMoveGhost(pieceKey, sourceImg, start);
  await animateGhostAlongPoints(ghost, points);
  ghost.remove();
  if (sourceImg) sourceImg.style.visibility = '';
}

async function animateBoardMove(move, movingPiece) {
  const kingPath = pathSquaresForMove(move, movingPiece);
  if (!move.isCastle) {
    await animateSinglePieceMove(movingPiece, move.fromR, move.fromC, kingPath);
    return;
  }

  // Castle: animate king and rook together so it feels like one move.
  const side = pieceSide(movingPiece);
  const row = side === WHITE ? 7 : 0;
  const rookFromC = move.isCastle === 'K' ? 7 : 0;
  const rookToC = move.isCastle === 'K' ? 5 : 3;
  const rookPiece = board[row][rookFromC];
  const rookPath = pathSquaresLinear(row, rookFromC, row, rookToC);

  await Promise.all([
    animateSinglePieceMove(movingPiece, move.fromR, move.fromC, kingPath),
    animateSinglePieceMove(rookPiece, row, rookFromC, rookPath)
  ]);
}

function clearHighlights() {
  document.querySelectorAll('.cell').forEach(cell => {
    cell.classList.remove('selected', 'legal', 'capture', 'in-check', 'in-danger', 'last-from', 'last-to');
  });
}

function renderBoard() {
  clearHighlights();

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const cell = getCell(r, c);
      const piece = board[r][c];
      cell.innerHTML = '';

      if (c === 0) {
        const rank = document.createElement('span');
        rank.className = 'cell-rank-label';
        rank.textContent = String(8 - r);
        cell.appendChild(rank);
      }
      if (r === 7) {
        const file = document.createElement('span');
        file.className = 'cell-file-label';
        file.textContent = FILES[c];
        cell.appendChild(file);
      }

      if (piece) {
        const img = document.createElement('img');
        img.className = 'piece ' + (pieceSide(piece) === WHITE ? 'white' : 'black');
        img.src = PIECE_SVGS[piece];
        img.alt = piece;
        img.draggable = false;
        if (lastMove && lastMove.toR === r && lastMove.toC === c) img.classList.add('last-move');
        cell.appendChild(img);
      }
    }
  }

  if (lastMove) {
    const fromCell = getCell(lastMove.fromR, lastMove.fromC);
    const toCell = getCell(lastMove.toR, lastMove.toC);
    if (fromCell) fromCell.classList.add('last-from');
    if (toCell) toCell.classList.add('last-to');
  }

  const state = cloneState();
  const dangerSide = onePlayer ? humanSide : turn;
  const threatened = threatenedSquaresForSide(state, dangerSide);
  for (const sq of threatened) {
    const dangerCell = getCell(sq.r, sq.c);
    if (dangerCell) dangerCell.classList.add('in-danger');
  }

  if (selectedSquare) {
    getCell(selectedSquare.r, selectedSquare.c).classList.add('selected');
    for (const mv of legalForSelected) {
      const target = getCell(mv.toR, mv.toC);
      target.classList.add('legal');
      if (board[mv.toR][mv.toC] || mv.isEnPassant) target.classList.add('capture');
    }
  }

  const checkSide = turn;
  if (!gameOver && isKingInCheck(state, checkSide)) {
    const king = findKing(state, checkSide);
    if (king) getCell(king.r, king.c).classList.add('in-check');
  }

  setActivePanel();
  renderInsights();
  requestAnimationFrame(positionInsightsNearBoard);
}

function clearSelection() {
  selectedSquare = null;
  legalForSelected = [];
}

function canLocalMove() {
  if (gameOver || busy) return false;
  if (asyncMode && !canLocalMoveInAsync()) return false;
  if (onePlayer && turn !== humanSide) return false;
  return true;
}

function onCellClick(e) {
  const cell = e.currentTarget;
  const r = Number(cell.dataset.r);
  const c = Number(cell.dataset.c);

  if (!canLocalMove()) {
    if (asyncMode && !canLocalMoveInAsync()) showAsyncWaitingPrompt();
    return;
  }

  const piece = board[r][c];

  if (!selectedSquare) {
    if (piece && pieceSide(piece) === turn) {
      sfxSelectPiece();
      selectedSquare = { r, c };
      legalForSelected = legalMovesFrom(r, c);
      if (legalForSelected.length === 0) {
        const state = cloneState();
        const pseudo = pseudoMovesFrom(state, turn, r, c);
        if (pseudo.length && isPinnedPiece(state, turn, r, c)) {
          showAnnouncement('PINNED PIECE', 'MOVING IT EXPOSES YOUR KING', 'danger', 1700, 'center');
        }
      }
      renderBoard();
    }
    return;
  }

  if (selectedSquare.r === r && selectedSquare.c === c) {
    clearSelection();
    renderBoard();
    return;
  }

  const chosenMove = legalForSelected.find(mv => mv.toR === r && mv.toC === c);
  if (chosenMove) {
    playMove(chosenMove, true);
    return;
  }

  if (piece && pieceSide(piece) === turn) {
    sfxSelectPiece();
    selectedSquare = { r, c };
    legalForSelected = legalMovesFrom(r, c);
    renderBoard();
    return;
  }

  clearSelection();
  renderBoard();
}

function moveMatchesTemplate(move, template) {
  return move.fromR === template.fromR &&
    move.fromC === template.fromC &&
    move.toR === template.toR &&
    move.toC === template.toC &&
    (template.promotion ? move.promotion === template.promotion : true);
}

async function playMove(move, fromHuman = false) {
  if (gameOver || busy) return false;
  const state = cloneState();
  const legal = generateLegalMoves(state, turn);
  const exact = legal.find(m => moveMatchesTemplate(m, move));
  if (!exact) return false;

  const sourcePiece = board[exact.fromR][exact.fromC];
  const targetPiece = board[exact.toR][exact.toC];
  if (!sourcePiece) return false;
  if (onePlayer) tickCpuMoodTurn();

  busy = true;
  clearCpuTauntTimers();
  clearSelection();
  renderBoard();
  await animateBoardMove(exact, sourcePiece);

  const next = applyMoveToState(state, exact);
  applyState(next);
  const deliveredCheck = isKingInCheck(cloneState(), turn);

  lastMove = { fromR: exact.fromR, fromC: exact.fromC, toR: exact.toR, toC: exact.toC };
  moveHistory.push(moveToUci(exact));

  if (targetPiece || exact.isEnPassant) {
    sfxCapture(targetPiece || sourcePiece);
  } else {
    captureCombo = 0;
    sfxMove(sourcePiece, exact);
  }

  renderBoard();
  updateShareHash();
  persistCurrentModeSession();

  const status = evaluateGameStatus();
  if (status.ended) {
    await endRound(status);
    busy = false;
    return true;
  }

  if (deliveredCheck) {
    sfxCheck();
    showAnnouncement(formatSide(turn) + ' IN CHECK', '', 'danger', 1200);
  }

  if (onePlayer) {
    reactCpuPersonaToMove({
      prevState: state,
      nextState: next,
      move: exact,
      moverSide: pieceSide(sourcePiece),
      sourcePiece,
      targetPiece,
      fromHuman,
      deliveredCheck
    });
  }

  if (onePlayer && turn !== humanSide) {
    busy = false;
    queueCpuMove();
  } else if (asyncMode && !canLocalMoveInAsync()) {
    busy = false;
    showAsyncWaitingPrompt();
  } else {
    busy = false;
  }

  refreshCpuTauntLoop();

  return true;
}

function evaluateGameStatus() {
  const state = cloneState();
  const legal = generateLegalMoves(state, turn);
  const inCheck = isKingInCheck(state, turn);

  if (legal.length === 0) {
    if (inCheck) {
      return { ended: true, winner: otherSide(turn), reason: 'checkmate' };
    }
    return { ended: true, winner: null, reason: 'stalemate' };
  }

  if (halfmoveClock >= 100) return { ended: true, winner: null, reason: 'fifty' };

  const allPieces = [];
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) if (board[r][c]) allPieces.push(board[r][c]);
  }
  const minorOnly = allPieces.every(p => ['k', 'b', 'n'].includes(pieceType(p)));
  if (minorOnly && allPieces.filter(p => pieceType(p) !== 'k').length <= 1) {
    return { ended: true, winner: null, reason: 'insufficient' };
  }

  return { ended: false };
}

async function endRound(status) {
  clearCpuTauntTimers();
  gameOver = true;
  winner = status.winner;

  if (winner === WHITE || winner === BLACK) {
    scores[winner]++;
    updateScore();
    sfxRoundWin();
    launchFireworks(winner);

    const label = formatSide(winner);
    const reasonText = status.reason === 'checkmate' ? 'CHECKMATE' : 'WINS';
    showAnnouncement(label + ' ' + reasonText, 'ROUND OVER', 'good', 2400);

    if (onePlayer) {
      if (winner === humanSide) cpuSay('lose', 'sad');
      else cpuSay('win', 'taunt');
    }

    if (status.reason === 'checkmate') {
      const celebrationMode = onePlayer && winner !== humanSide ? 'cpu' : 'human';
      await playCheckmateCelebration(CHECKMATE_CELEBRATION_MS, celebrationMode);
    }

    if (scores[winner] >= MATCH_TARGET) {
      showMatchEndOverlay(`${label} WINS MATCH`, `${scores.w} — ${scores.b}`);
    } else {
      showRoundEndOverlay(`${label} WINS ROUND`, `Reason: ${status.reason.toUpperCase()}`);
    }
  } else {
    sfxDraw();
    showAnnouncement('DRAW', status.reason.toUpperCase(), 'default', 2200);
    showRoundEndOverlay('DRAW', `Reason: ${status.reason.toUpperCase()}`);
  }

  renderBoard();
  updateShareHash();
  persistCurrentModeSession();
}

function sanitizeSessionSnapshot(raw, modeKey) {
  if (!raw || typeof raw !== 'object') return null;
  if (typeof raw.fen !== 'string') return null;
  if (!Array.isArray(raw.moveHistory)) return null;
  const parsed = fenToState(raw.fen);
  if (!parsed) return null;
  return {
    mode: modeKey,
    fen: raw.fen,
    scores: {
      w: Number(raw.scores && raw.scores.w) || 0,
      b: Number(raw.scores && raw.scores.b) || 0
    },
    moveHistory: raw.moveHistory.filter(x => typeof x === 'string' && /^[a-h][1-8][a-h][1-8][qrbn]?$/.test(x)).slice(0, 800),
    onePlayer: !!raw.onePlayer,
    humanSide: raw.humanSide === BLACK ? BLACK : WHITE,
    difficulty: ['ROOKIE', 'PRO', 'MASTER'].includes(raw.difficulty) ? raw.difficulty : 'PRO',
    asyncMode: !!raw.asyncMode,
    asyncSeat: (raw.asyncSeat === WHITE || raw.asyncSeat === BLACK) ? raw.asyncSeat : null,
    asyncGameId: (typeof raw.asyncGameId === 'string' && /^[a-z0-9]{6,20}$/i.test(raw.asyncGameId)) ? raw.asyncGameId : null,
    gameOver: !!raw.gameOver,
    winner: (raw.winner === WHITE || raw.winner === BLACK) ? raw.winner : null,
    lastMove: raw.lastMove || null
  };
}

function loadPersistedSessions() {
  try {
    const raw = localStorage.getItem(SESSION_STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    for (const modeKey of ['cpu', 'pass', 'link']) {
      sessionByMode[modeKey] = sanitizeSessionSnapshot(parsed[modeKey], modeKey);
    }
  } catch {}
}

function clearSession(modeKey) {
  sessionByMode[modeKey] = null;
  persistSessions();
}

function persistCurrentModeSession() {
  const modeKey = currentModeKey();
  const snapshot = {
    mode: modeKey,
    fen: stateToFen(cloneState()),
    scores: { ...scores },
    moveHistory: moveHistory.slice(-900),
    onePlayer,
    humanSide,
    difficulty,
    asyncMode,
    asyncSeat,
    asyncGameId,
    gameOver,
    winner,
    lastMove
  };
  sessionByMode[modeKey] = snapshot;
  persistSessions();
}

function restoreSession(modeKey) {
  const snap = sessionByMode[modeKey];
  if (!snap) return false;
  const parsed = fenToState(snap.fen);
  if (!parsed) return false;

  applyState(parsed);
  scores = { ...snap.scores };
  moveHistory = snap.moveHistory.slice();
  onePlayer = !!snap.onePlayer;
  humanSide = snap.humanSide === BLACK ? BLACK : WHITE;
  difficulty = snap.difficulty;
  asyncMode = !!snap.asyncMode;
  asyncSeat = (snap.asyncSeat === WHITE || snap.asyncSeat === BLACK) ? snap.asyncSeat : null;
  asyncGameId = snap.asyncGameId || null;
  gameOver = !!snap.gameOver;
  winner = snap.winner;
  lastMove = snap.lastMove || null;

  document.getElementById('difficulty-btn').value = difficulty;
  hideAllOverlays();
  setControlVisibility();
  setCpuFaceVisibility();
  setCpuChatVisibility();
  updateScore();
  renderBoard();
  requestAnimationFrame(sizeBoard);

  if (!gameOver && asyncMode) {
    if (canLocalMoveInAsync()) showAsyncYourTurnPrompt();
    else showAsyncWaitingPrompt();
  } else if (!gameOver && onePlayer && turn !== humanSide) {
    queueCpuMove(true);
  } else {
    refreshCpuTauntLoop();
  }
  return true;
}

function switchMode(mode) {
  persistCurrentModeSession();
  if (restoreSession(mode)) return;
  applyMode(mode, true);
  if (mode === 'link') showAsyncYourTurnPrompt(true);
}

function createChallengeId() {

function rememberActiveChallenge(hash) {
  if (!hash) return;
  try {
    const raw = localStorage.getItem(ACTIVE_CHALLENGES_KEY);
    const current = raw ? JSON.parse(raw) : [];
    const clean = Array.isArray(current) ? current.filter(x => x && typeof x.hash === 'string') : [];
    const now = Date.now();
    const existing = clean.find(x => x.hash === hash);
    if (existing) existing.updatedAt = now;
    else clean.unshift({ hash, updatedAt: now });
    clean.sort((a, b) => b.updatedAt - a.updatedAt);
    localStorage.setItem(ACTIVE_CHALLENGES_KEY, JSON.stringify(clean.slice(0, MAX_ACTIVE_CHALLENGES)));
  } catch {}
}

function loadActiveChallenges() {
  try {
    const raw = localStorage.getItem(ACTIVE_CHALLENGES_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return [];
    return parsed.filter(x => x && typeof x.hash === 'string').slice(0, MAX_ACTIVE_CHALLENGES);
  } catch {
    return [];
  }
}

function renderActiveChallengesMenu() {
  const wrap = document.getElementById('active-challenges');
  const list = document.getElementById('active-challenge-list');
  const entries = loadActiveChallenges();

  if (!entries.length) {
    wrap.classList.add('hidden');
    list.innerHTML = '';
    return;
  }

  wrap.classList.remove('hidden');
  list.innerHTML = '';

  for (const item of entries) {
    const btn = document.createElement('button');
    btn.className = 'active-link-btn';
    const stamp = new Date(item.updatedAt || Date.now()).toLocaleString();
    btn.textContent = `Resume challenge (${stamp})`;
    btn.addEventListener('click', () => {
      window.location.hash = item.hash;
      window.location.reload();
    });
    list.appendChild(btn);
  }
}

function shareHashFromState(seat = null, gameId = null) {

  params.set('mh', moveHistory.join(','));
  if (typeof gameId === 'string' && /^[a-z0-9]{6,20}$/i.test(gameId)) params.set('g', gameId);

  history.replaceState(null, '', '#' + hash);

function miniBoardEmoji() {
  const map = {
    wp: '♙︎', wn: '♘︎', wb: '♗︎', wr: '♖︎', wq: '♕︎', wk: '♔︎',
    bp: '♟︎', bn: '♞︎', bb: '♝︎', br: '♜︎', bq: '♛︎', bk: '♚︎',
    empty: '·'
  };
  const lines = [];
  for (let r = 0; r < 8; r++) {
    const rank = 8 - r;
    const cells = [];
    for (let c = 0; c < 8; c++) {
      const p = board[r][c];
      cells.push(map[p || 'empty']);
    }
    lines.push(`${rank} ${cells.join(' ')}`);
  }
  lines.push('  a b c d e f g h');
  return lines.join('\n');
}

function shareMessage(link) {
  return `${statusLineForShare()}\n\n${miniBoardEmoji()}\n\n${link}`;
}

async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(text);
    return true;
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  const ok = document.execCommand('copy');
  document.body.removeChild(ta);
  return ok;
}

async function shareViaSystemSheet(message) {
  if (!navigator.share) return { supported: false, shared: false, canceled: false };
  try {
    await navigator.share({ text: message });
    return { supported: true, shared: true, canceled: false };
  } catch (e) {
    const canceled = !!(e && (e.name === 'AbortError' || e.name === 'NotAllowedError'));
    return { supported: true, shared: false, canceled };
  }
}

async function shareCurrentPosition(opts = {}) {
  const { messageOverride = null, toastTitle = 'SHARE READY' } = opts;
  const link = buildShareLink();
  const message = messageOverride || shareMessage(link);

  const system = await shareViaSystemSheet(message);
  if (system.shared) {
    showAnnouncement(toastTitle, 'OPENED SHARE MENU', 'default', 1200);
    return { shared: true, copied: false, canceled: false, link, message };
  }

  if (system.canceled) return { shared: false, copied: false, canceled: true, link, message };

  let copied = false;
  try { copied = await copyText(message); } catch { copied = false; }
  const sub = copied ? 'LINK + BOARD COPIED' : 'COPY FAILED';
  showAnnouncement(toastTitle, sub, copied ? 'good' : 'danger', 1400);
  if (!copied) window.prompt('Copy this message:', message);
  return { shared: false, copied, canceled: false, link, message };
}

function buildCheckmateConfetti(count = 64) {
  const layer = document.getElementById('checkmate-confetti');
  if (!layer) return;
  layer.innerHTML = '';

  const palette = ['#ffd166', '#ef476f', '#06d6a0', '#118ab2', '#f8f9fa', '#9b5de5'];
  for (let i = 0; i < count; i++) {
    const chip = document.createElement('i');
    chip.className = 'checkmate-chip';

    const angle = Math.random() * Math.PI * 2;
    const distance = 95 + Math.random() * 220;
    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance - (18 + Math.random() * 36);
    const size = 5 + Math.random() * 8;
    const delay = Math.random() * 190;
    const spin = (-360 + Math.random() * 720).toFixed(1);
    const color = palette[Math.floor(Math.random() * palette.length)];

    chip.style.setProperty('--dx', `${dx.toFixed(1)}px`);
    chip.style.setProperty('--dy', `${dy.toFixed(1)}px`);
    chip.style.setProperty('--dr', `${spin}deg`);
    chip.style.setProperty('--delay', `${delay.toFixed(0)}ms`);
    chip.style.setProperty('--size', `${size.toFixed(1)}px`);
    chip.style.setProperty('--c', color);
    layer.appendChild(chip);
  }
}

function playCheckmateCelebration(durationMs = CHECKMATE_CELEBRATION_MS, mode = 'human') {
  return new Promise((resolve) => {
    const el = document.getElementById('checkmate-celebration');
    const layer = document.getElementById('checkmate-confetti');
    if (!el) {
      resolve();

    }

function launchFireworks(winSide) {
  const canvas = document.getElementById('celebration-canvas');
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  canvas.classList.remove('hidden');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colorA = winSide === WHITE ? 'rgba(255, 231, 182, 0.95)' : 'rgba(150, 200, 255, 0.95)';
  const colorB = winSide === WHITE ? 'rgba(255, 245, 220, 0.88)' : 'rgba(194, 228, 255, 0.88)';
  const particles = [];

  for (let i = 0; i < 64; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.8 + Math.random() * 4.6;
    particles.push({
      x: canvas.width * (0.25 + Math.random() * 0.5),
      y: canvas.height * (0.18 + Math.random() * 0.45),
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.9 + Math.random() * 0.8,
      ttl: 0.9 + Math.random() * 0.8,
      size: 2 + Math.random() * 4,
      color: Math.random() < 0.5 ? colorA : colorB
    });
  }

  const start = performance.now();
  function frame(now) {
    const dt = Math.min(0.04, (now - (frame.prev || now)) / 1000);
    frame.prev = now;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (const p of particles) {
      p.vy += 7.2 * dt;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= dt;
      if (p.life <= 0) continue;
      ctx.globalAlpha = Math.max(0, p.life / p.ttl);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;

    if (now - start < 1300) {
      requestAnimationFrame(frame);
    } else {
      canvas.classList.add('hidden');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  requestAnimationFrame(frame);
}
