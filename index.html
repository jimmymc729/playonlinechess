function parseSharedStateIfPresent() {
  const raw = window.location.hash.replace(/^#/, '');
  if (!raw) return false;
  const params = new URLSearchParams(raw);
  if (!(params.get('a') === '1' || params.has('f'))) return false;

  const fen = params.get('f');
  const state = fen ? fenToState(fen) : null;
  if (!state) return false;

  const scoreW = Number(params.get('sw') || 0);
  const scoreB = Number(params.get('sb') || 0);
  const seat = params.get('p');
  const gameId = params.get('g');

  applyState(state);
  scores.w = Number.isFinite(scoreW) ? Math.max(0, Math.floor(scoreW)) : 0;
  scores.b = Number.isFinite(scoreB) ? Math.max(0, Math.floor(scoreB)) : 0;
  moveHistory = [];
  const mhRaw = params.get('mh') || '';
  if (mhRaw) {
    moveHistory = mhRaw.split(',').filter(x => /^[a-h][1-8][a-h][1-8][qrbn]?$/.test(x)).slice(-900);
  }

  onePlayer = false;
  clearCpuTauntTimers();
  asyncMode = true;
  asyncSeat = seat === WHITE || seat === BLACK ? seat : turn;
  asyncGameId = (typeof gameId === 'string' && /^[a-z0-9]{6,20}$/i.test(gameId)) ? gameId : createChallengeId();

  gameOver = false;
  winner = null;
  lastMove = moveHistory.length ? parseUciMove(moveHistory[moveHistory.length - 1]) : null;

  const status = evaluateGameStatus();
  if (status.ended) {
    gameOver = true;
    winner = status.winner;
  }

  rememberActiveChallenge(raw);
  hideAllOverlays();

  updateScore();
  setControlVisibility();
  setCpuFaceVisibility();
  setCpuChatVisibility();
  renderBoard();
  requestAnimationFrame(sizeBoard);

  if (!gameOver) {
    if (canLocalMoveInAsync()) showAsyncYourTurnPrompt(true);
    else showAsyncWaitingPrompt();
  }

  updateShareHash();
  persistCurrentModeSession();
  return true;
}

window.addEventListener('resize', sizeBoard);
window.addEventListener('pagehide', persistCurrentModeSession);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    clearCpuTauntTimers();
  } else {
    refreshCpuTauntLoop();
  }
  if (document.visibilityState === 'hidden') persistCurrentModeSession();
});

document.getElementById('ready-p1').addEventListener('click', () => {
  sfxClick();
  readyState.w = true;
  document.getElementById('ready-p1').textContent = 'WHITE READY ✓';
  if (readyState.w && readyState.b) {
    hideAllOverlays();
    readyState = { w: false, b: false };
  }
});

document.getElementById('ready-p2').addEventListener('click', () => {
  sfxClick();
  readyState.b = true;
  document.getElementById('ready-p2').textContent = 'BLACK READY ✓';
  if (readyState.w && readyState.b) {
    hideAllOverlays();
    readyState = { w: false, b: false };
  }
});

document.getElementById('mode-cpu').addEventListener('click', () => {
  sfxClick();
  switchMode('cpu');
});

document.getElementById('mode-pass').addEventListener('click', () => {
  sfxClick();
  switchMode('pass');
});

document.getElementById('mode-link').addEventListener('click', () => {
  sfxClick();
  switchMode('link');
});

document.getElementById('cpu-side-white').addEventListener('click', () => {
  sfxClick();
  humanSide = WHITE;
  hideAllOverlays();
  setCpuFaceVisibility();
  setCpuChatVisibility();
  startRound();
});

document.getElementById('cpu-side-black').addEventListener('click', () => {
  sfxClick();
  humanSide = BLACK;
  hideAllOverlays();
  setCpuFaceVisibility();
  setCpuChatVisibility();
  startRound();
});

document.getElementById('difficulty-btn').addEventListener('change', (e) => {
  difficulty = e.target.value;
  persistCurrentModeSession();
  sfxClick();
});

document.getElementById('board-theme-btn').addEventListener('change', (e) => {
  applyBoardTheme(e.target.value, true);
  sfxClick();
});

document.getElementById('reset-btn').addEventListener('click', () => {
  const ok = window.confirm('Reset this game and start fresh in the current mode?');
  if (!ok) return;
  sfxClick();
  doReset();
});

document.getElementById('menu-btn').addEventListener('click', () => {
  sfxClick();
  const visible = !document.getElementById('mode-select').classList.contains('hidden');
  if (visible) {
    closeModeSelect();
    return;
  }
  showOverlay('mode-select');
  renderActiveChallengesMenu();
});

document.getElementById('mode-close-btn').addEventListener('click', () => {
  sfxClick();
  closeModeSelect();
});

document.getElementById('next-round-btn').addEventListener('click', () => { sfxClick(); nextRound(); });
document.getElementById('new-match-btn').addEventListener('click', () => { sfxClick(); newMatch(); });
document.getElementById('mode-menu-btn').addEventListener('click', () => { sfxClick(); returnToModeSelect(); });
document.getElementById('challenge-link-btn').addEventListener('click', () => {
  sfxClick();
  applyMode('link', true);
  showAsyncYourTurnPrompt(true);
});

document.getElementById('sound-btn').addEventListener('click', () => {
  soundOn = !soundOn;
  document.getElementById('sound-btn').textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) sfxClick();
});

document.getElementById('share-btn').addEventListener('click', async () => {
  await shareCurrentPosition();
  if (asyncMode && !canLocalMoveInAsync()) showAsyncWaitingPrompt();
});

document.getElementById('async-share-btn').addEventListener('click', async () => {
  sfxClick();
  await shareCurrentPosition();
  showAsyncWaitingPrompt();
});

document.getElementById('async-remind-btn').addEventListener('click', async () => {
  sfxClick();
  const link = buildShareLink();
  await shareCurrentPosition({ messageOverride: `⏰ Reminder: ${statusLineForShare()}\n\n${miniBoardEmoji()}\n\n${link}`, toastTitle: 'REMINDER READY' });
  showAsyncWaitingPrompt();
});

document.getElementById('async-close-btn').addEventListener('click', () => {
  sfxClick();
  hideAsyncTurnOverlay();
});

document.getElementById('async-turn-overlay').addEventListener('click', (e) => {
  if (e.target.id !== 'async-turn-overlay') return;
  hideAsyncTurnOverlay();
});

document.getElementById('mode-select').addEventListener('click', (e) => {
  if (e.target.id !== 'mode-select') return;
  closeModeSelect();
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!document.getElementById('mode-select').classList.contains('hidden')) closeModeSelect();
});

document.getElementById('announce').addEventListener('click', hideAnnouncement);

// Init
resetPosition();
buildBoard();
applyBoardTheme(loadPreferredBoardTheme(), false);
loadPersistedSessions();
selectedMode = loadPreferredMode();
updateModeMenuHighlight(selectedMode);
renderActiveChallengesMenu();
updateScore();

if (!parseSharedStateIfPresent()) {
  const restored = restoreSession(selectedMode);
  if (!restored) {
    setControlVisibility();
    setCpuFaceVisibility();
    setCpuChatVisibility();
    renderBoard();
  }
}

if (!onePlayer && !asyncMode && document.getElementById('mode-select').classList.contains('hidden')) {
  showReadyOverlayForNextTurn();
}

setTimeout(sizeBoard, 40);
</script>
</body>
</html>
